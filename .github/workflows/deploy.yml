name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # =========================================================================
  # 1. RUN pytest SUITES
  # =========================================================================
  test:
    name: Run Pytest Suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          PYTHONPATH: .
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: password
          GCP_PROJECT_ID: test-project
        run: |
          pytest tests/profiler_vectorizer/ tests/validation_drift/ tests/quality/

  # =========================================================================
  # 2. BUILD AND PUSH IMAGE
  # =========================================================================
  build:
    name: Build and Push Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 3. DEPLOY FastAPI BACKEND API
  # =========================================================================
  deploy-api:
    name: Deploy Backend API
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Set up GCloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 470.0.0'

      - name: Capture Active Revision
        run: |
          PREV_REV=$(gcloud run services describe backend-api --region ${{ vars.REGION }} --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "")
          echo "PREV_REV=$PREV_REV" >> $GITHUB_ENV
          echo "Captured previous revision: $PREV_REV"

      - name: Deploy backend-api to Cloud Run
        run: |
          gcloud run deploy backend-api \
            --image ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/backend:${{ github.sha }} \
            --region ${{ vars.REGION }} \
            --platform managed \
            --service-account ${{ vars.BACKEND_RUNTIME_SERVICE_ACCOUNT }} \
            --min-instances 0 \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ vars.CLOUD_SQL_CONNECTION_NAME }} \
            --set-env-vars "GCP_PROJECT_ID=${{ vars.PROJECT_ID }},DB_NAME=${{ vars.DB_NAME }},DB_PORT=${{ vars.DB_PORT }},CLOUD_SQL_CONNECTION_NAME=${{ vars.CLOUD_SQL_CONNECTION_NAME }},SMTP_HOST=${{ vars.SMTP_HOST }},SMTP_PORT=${{ vars.SMTP_PORT }},NOTIFICATION_EMAIL_SENDER=${{ vars.NOTIFICATION_EMAIL_SENDER }},DB_HOST=127.0.0.1" \
            --set-secrets "DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest,SLACK_WEBHOOK_DEAD_LETTER=SLACK_WEBHOOK_DEAD_LETTER:latest,SLACK_WEBHOOK_NEW_TABLE=SLACK_WEBHOOK_NEW_TABLE:latest,SLACK_WEBHOOK_JOB_COMPLETED=SLACK_WEBHOOK_JOB_COMPLETED:latest,SLACK_WEBHOOK_JOB_FAILED=SLACK_WEBHOOK_JOB_FAILED:latest,SLACK_WEBHOOK_QUALITY_CHECK=SLACK_WEBHOOK_QUALITY_CHECK:latest"

      - name: Smoke Test Backend API
        run: |
          API_URL=$(gcloud run services describe backend-api --region ${{ vars.REGION }} --format="value(status.url)")
          echo "Testing live URL: $API_URL"
          for i in {1..3}; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/")
            echo "Attempt $i: HTTP Status $STATUS_CODE"
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "Smoke test passed!"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed!"
          exit 1

      - name: Rollback Backend API on Failure
        if: failure() && env.PREV_REV != ''
        run: |
          echo "Rolling back backend-api to revision: $PREV_REV"
          gcloud run services update-traffic backend-api \
            --region ${{ vars.REGION }} \
            --to-revisions=$PREV_REV=100

  # =========================================================================
  # 4. DEPLOY WORKERS
  # =========================================================================
  deploy-workers:
    name: Deploy Workers
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: false
      matrix:
        worker:
          - name: worker-ingestion
            module: workers.ingestion.main
          - name: worker-metadata
            module: workers.metadata.main
          - name: worker-metadata-vectorizer
            module: workers.vectorizers.metadata_vectorizer.main
          - name: worker-inference
            module: workers.inference.main
          - name: worker-validation
            module: workers.validation.main
          - name: worker-drift
            module: workers.drift.main
          - name: worker-recommendation
            module: workers.recommendation.main
          - name: worker-notification
            module: workers.notification.main
          - name: worker-target-vectorizer
            module: workers.vectorizers.target_vectorizer.main
          - name: worker-quality
            module: workers.quality.main
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Set up GCloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 470.0.0'

      - name: Capture Active Revision
        run: |
          PREV_REV=$(gcloud run services describe ${{ matrix.worker.name }} --region ${{ vars.REGION }} --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "")
          echo "PREV_REV=$PREV_REV" >> $GITHUB_ENV
          echo "Captured previous revision: $PREV_REV"

      - name: Deploy Worker to Cloud Run
        run: |
          gcloud run deploy ${{ matrix.worker.name }} \
            --image ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/backend:${{ github.sha }} \
            --region ${{ vars.REGION }} \
            --platform managed \
            --service-account ${{ vars.BACKEND_RUNTIME_SERVICE_ACCOUNT }} \
            --command python \
            --args=-m \
            --args=${{ matrix.worker.module }} \
            --min-instances 1 \
            --no-cpu-throttling \
            --add-cloudsql-instances ${{ vars.CLOUD_SQL_CONNECTION_NAME }} \
            --set-env-vars "GCP_PROJECT_ID=${{ vars.PROJECT_ID }},DB_NAME=${{ vars.DB_NAME }},DB_PORT=${{ vars.DB_PORT }},CLOUD_SQL_CONNECTION_NAME=${{ vars.CLOUD_SQL_CONNECTION_NAME }},SMTP_HOST=${{ vars.SMTP_HOST }},SMTP_PORT=${{ vars.SMTP_PORT }},NOTIFICATION_EMAIL_SENDER=${{ vars.NOTIFICATION_EMAIL_SENDER }},DB_HOST=127.0.0.1" \
            --set-secrets "DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest,SLACK_WEBHOOK_DEAD_LETTER=SLACK_WEBHOOK_DEAD_LETTER:latest,SLACK_WEBHOOK_NEW_TABLE=SLACK_WEBHOOK_NEW_TABLE:latest,SLACK_WEBHOOK_JOB_COMPLETED=SLACK_WEBHOOK_JOB_COMPLETED:latest,SLACK_WEBHOOK_JOB_FAILED=SLACK_WEBHOOK_JOB_FAILED:latest,SLACK_WEBHOOK_QUALITY_CHECK=SLACK_WEBHOOK_QUALITY_CHECK:latest"

      - name: Get Worker URL
        id: worker_url
        run: |
          URL=$(gcloud run services describe ${{ matrix.worker.name }} --region ${{ vars.REGION }} --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Get OIDC Token for Worker
        id: token_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          token_format: 'id_token'
          id_token_audience: ${{ steps.worker_url.outputs.url }}

      - name: Smoke Test Worker
        run: |
          URL="${{ steps.worker_url.outputs.url }}"
          echo "Testing live URL: $URL"
          TOKEN="${{ steps.token_auth.outputs.id_token }}"
          for i in {1..3}; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$URL/")
            echo "Attempt $i: HTTP Status $STATUS_CODE"
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "Smoke test passed!"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed!"
          exit 1

      - name: Rollback Worker on Failure
        if: failure() && env.PREV_REV != ''
        run: |
          echo "Rolling back ${{ matrix.worker.name }} to revision: $PREV_REV"
          gcloud run services update-traffic ${{ matrix.worker.name }} \
            --region ${{ vars.REGION }} \
            --to-revisions=$PREV_REV=100

  # =========================================================================
  # 5. DEPLOY FRONTEND WEBSITE
  # =========================================================================
  deploy-frontend:
    name: Deploy Frontend
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Set up GCloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 470.0.0'

      - name: Build and Sync Frontend
        run: |
          # Query backend API URL dynamically
          API_URL=$(gcloud run services describe backend-api --region ${{ vars.REGION }} --format="value(status.url)")
          echo "Fetched Backend API URL: $API_URL"
          
          # Compile React frontend with environment variable injected
          VITE_API_URL="$API_URL" npm run build --prefix frontend
          
          # Synchronize build assets to static GCS bucket
          gcloud storage rsync frontend/dist gs://${{ vars.FRONTEND_BUCKET }} \
            --recursive \
            --delete-unmatched-destination-objects
