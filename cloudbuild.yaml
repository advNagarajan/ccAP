steps:
  # =========================================================================
  # 1. FRONTEND STUFF
  # =========================================================================

  # Step 1: Build the Frontend web image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/smart-data-frontend:latest'
      - '-f'
      - 'frontend/frontend.Dockerfile'
      - './frontend'

  # Step 2: Push the Frontend web image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/smart-data-frontend:latest'

  # Step 3: Deploy the Frontend Nginx Website to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'frontend-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smart-data-frontend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # =========================================================================
  # 2. BACKEND STUFF
  # =========================================================================

  # Step 4: Build the unified Python backend/worker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/smart-data-platform:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Step 5: Run pytest tests inside the built backend container
  - name: 'gcr.io/$PROJECT_ID/smart-data-platform:latest'
    id: 'run-tests'
    entrypoint: 'pytest'
    args:
      - 'tests/profiler_vectorizer/'
      - 'tests/validation_drift/'
      - 'tests/quality/'

  # Step 6: Push the Python backend/worker image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/smart-data-platform:latest'

  # Step 7: Deploy the FastAPI Backend API to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'backend-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smart-data-platform:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # =========================================================================
  # 3. INGESTION WORKER
  # =========================================================================

  # Step 8: Deploy Ingestion Worker (CPU always on, min-instances=1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker-ingestion'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'worker-ingestion'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smart-data-platform:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--command'
      - 'python'
      - '--args'
      - '-m,workers.ingestion.main'
      - '--min-instances'
      - '1'
      - '--no-cpu-throttling'
      - '--allow-unauthenticated'

  # =========================================================================
  # 4. METADATA EXTRACTION WORKER
  # =========================================================================

  # Step 9: Deploy Metadata Worker (CPU always on, min-instances=1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker-metadata'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'worker-metadata'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smart-data-platform:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--command'
      - 'python'
      - '--args'
      - '-m,workers.metadata.main'
      - '--min-instances'
      - '1'
      - '--no-cpu-throttling'
      - '--allow-unauthenticated'

  # =========================================================================
  # 5. METADATA VECTORIZER WORKER
  # =========================================================================

  # Step 10: Deploy Metadata Vectorizer Worker (CPU always on, min-instances=1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker-metadata-vectorizer'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'worker-metadata-vectorizer'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smart-data-platform:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--command'
      - 'python'
      - '--args'
      - '-m,workers.vectorizers.metadata_vectorizer.main'
      - '--min-instances'
      - '1'
      - '--no-cpu-throttling'
      - '--allow-unauthenticated'

  # =========================================================================
  # 6. TARGET INFERENCE WORKER
  # =========================================================================

  # Step 11: Deploy Inference Worker (CPU always on, min-instances=1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker-inference'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'worker-inference'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smart-data-platform:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--command'
      - 'python'
      - '--args'
      - '-m,workers.inference.main'
      - '--min-instances'
      - '1'
      - '--no-cpu-throttling'
      - '--allow-unauthenticated'

  # =========================================================================
  # 7. SCHEMA VALIDATION WORKER
  # =========================================================================

  # Step 12: Deploy Validation Worker (CPU always on, min-instances=1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker-validation'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'worker-validation'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smart-data-platform:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--command'
      - 'python'
      - '--args'
      - '-m,workers.validation.main'
      - '--min-instances'
      - '1'
      - '--no-cpu-throttling'
      - '--allow-unauthenticated'

  # =========================================================================
  # 8. DRIFT DETECTION WORKER
  # =========================================================================

  # Step 13: Deploy Drift Worker (CPU always on, min-instances=1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker-drift'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'worker-drift'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smart-data-platform:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--command'
      - 'python'
      - '--args'
      - '-m,workers.drift.main'
      - '--min-instances'
      - '1'
      - '--no-cpu-throttling'
      - '--allow-unauthenticated'

  # =========================================================================
  # 9. RECOMMENDATION GENERATION WORKER
  # =========================================================================

  # Step 14: Deploy Recommendation Worker (CPU always on, min-instances=1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker-recommendation'
    entrypoint: 'gcloud'
