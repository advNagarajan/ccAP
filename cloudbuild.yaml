  # =========================================================================
  # 11. TARGET VECTORIZER WORKER
  # =========================================================================

  # Step 16: Deploy Target Vectorizer Worker (CPU always on, min-instances=1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker-target-vectorizer'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'worker-target-vectorizer'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smart-data-platform:latest'
      - '--region'
