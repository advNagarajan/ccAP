      - '--allow-unauthenticated'

  # =========================================================================
  # 10. NOTIFICATION WORKER
  # =========================================================================

  # Step 15: Deploy Notification Worker (CPU always on, min-instances=1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker-notification'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'worker-notification'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smart-data-platform:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--command'
