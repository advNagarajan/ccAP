name: Deploy to AWS

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'workers/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy-aws.yml'

concurrency:
  group: production-aws
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. RUN pytest SUITES
  # =========================================================================
  test:
    name: Run Pytest Suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          PYTHONPATH: .
          CLOUD_PROVIDER: aws
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: password
        run: |
          pytest tests/profiler_vectorizer/ tests/validation_drift/ tests/quality/

  # =========================================================================
  # 2. BUILD AND PUSH IMAGE TO AMAZON ECR
  # =========================================================================
  build:
    name: Build and Push Image (ECR)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.AWS_ECR_REPO_NAME || 'data-landing-platform' }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.AWS_ECR_REPO_NAME || 'data-landing-platform' }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 3. BUILD & DEPLOY FRONTEND TO S3 & CLOUDFRONT
  # =========================================================================
  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

      - name: Build Frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8000' }}
        run: npm run build --prefix frontend

      - name: Sync Frontend to S3
        run: |
          aws s3 sync frontend/dist s3://${{ vars.AWS_FRONTEND_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        if: "${{ vars.AWS_CLOUDFRONT_DIST_ID != '' }}"
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DIST_ID }} \
            --paths "/*"
